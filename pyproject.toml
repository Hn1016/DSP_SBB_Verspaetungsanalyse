[project]
name = "sbb-delays"
version = "0.1.0"
description = "Verstärker und Absorber von Verspätungen im Schweizer Bahnnetz (SBB IstDaten)"
authors = [
    { name = "Hn1016", email = "Haonan.nuessli@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "duckdb>=1.5.5",
    "folium>=0.20.0",
    "geopandas>=1.1.4",
    "marimo>=0.25.0",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"
[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
